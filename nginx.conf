server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

  location = /es/ { return 301 /; }
  rewrite ^/es/calendario-laboral/(.*)$ /es/festivos/$1 permanent;
  rewrite ^/ca/calendari-laboral/(.*)$ /ca/festius/$1 permanent;
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
  }
  error_page 404 /404.html;
}
